spring:
  datasource:
    url: jdbc:h2:mem:orders;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
  flyway:
    schemas: orders
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: orders
acme:
  outbox:
    topics:
      order-events: order-events
      retry: order-events.retry
      dlt: order-events.dlt
    resubmit-after: PT1M
    resubmit-every: PT1M
