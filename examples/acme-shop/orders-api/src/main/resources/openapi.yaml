openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost
  description: Generated server url
paths:
  /api/v1/orders:
    get:
      tags:
      - order-controller
      operationId: list
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          minimum: 1
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrderDto"
    post:
      tags:
      - order-controller
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaceOrderCommand"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OrderDto"
  /api/v1/orders/{id}/cancel:
    post:
      tags:
      - order-controller
      operationId: cancel
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OrderDto"
  /api/v1/orders/{id}:
    get:
      tags:
      - order-controller
      operationId: get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OrderDto"
components:
  schemas:
    OrderLineDto:
      type: object
      properties:
        sku:
          type: string
          maxLength: 64
          minLength: 1
        quantity:
          type: integer
          format: int32
          exclusiveMinimum: 0
        unitPriceCents:
          type: integer
          format: int64
          exclusiveMinimum: 0
      required:
      - sku
    PlaceOrderCommand:
      type: object
      properties:
        currency:
          type: string
          minLength: 1
        lines:
          type: array
          items:
            $ref: "#/components/schemas/OrderLineDto"
          minItems: 1
      required:
      - currency
      - lines
    OrderDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        currency:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        lines:
          type: array
          items:
            $ref: "#/components/schemas/OrderLineDto"
