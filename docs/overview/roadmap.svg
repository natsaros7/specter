<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1552 700" width="1552" height="700" role="img" aria-labelledby="roadmap-title roadmap-desc">
<title id="roadmap-title">Specter on the Kiro stage ladder</title>
<desc id="roadmap-desc">Five stages from one session by hand to a coordinating agent; specter shipped stage 3 in 0.6.0 to 0.8.0 and built stage 4 in 0.9.0 and hardened it in 0.10.0, where the no-human setting is off until verified live; the next step is follow-ups and a live test of the recipe, and stage 5 is a later, separate layer, not built.</desc>
<defs>
<marker id="roadmap-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#4f5d75"/></marker>
<marker id="roadmap-ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#bf4520"/></marker>
</defs>
<rect width="1552" height="700" fill="#f5f5f5"/>
<style>text{font-family:Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif}.n{font-size:14px;font-weight:600;fill:#2d3142}.s{font-family:'Geist Mono', ui-monospace, Menlo, monospace;font-size:10.5px;fill:#5a6580}.l{font-family:'Geist Mono', ui-monospace, Menlo, monospace;font-size:10px;letter-spacing:.06em;fill:#4f5d75}.e{font-family:'Geist Mono', ui-monospace, Menlo, monospace;font-size:10.5px;letter-spacing:.12em;fill:#5a6580}.t{font-size:12px;fill:#2d3142}</style>
<text class="e" x="40" y="44">KIRO STAGE LADDER (VENDOR FRAMEWORK, SELF-REPORTED)</text><rect x="40" y="300" width="232" height="100" rx="6" fill="#ececec" stroke="#bfc0c0" stroke-width="1"/><text x="56" y="332" style="font-size:24px;font-weight:600;fill:#5a6580">1</text><text class="n" x="84" y="330" style="fill:#5a6580">One session by hand</text><text class="s" x="56" y="352" style="fill:#5a6580">before specter</text><rect x="288" y="250" width="232" height="150" rx="6" fill="#ececec" stroke="#bfc0c0" stroke-width="1"/><text x="304" y="282" style="font-size:24px;font-weight:600;fill:#5a6580">2</text><text class="n" x="332" y="280" style="fill:#5a6580">Many sessions by hand</text><text class="s" x="304" y="302" style="fill:#5a6580">before specter</text><text class="s" x="304" y="320">human is the glue</text><rect x="536" y="200" width="232" height="200" rx="6" fill="#dfe3ec" stroke="#2d3142" stroke-width="1.5"/><text x="552" y="232" style="font-size:24px;font-weight:600;fill:#2d3142">3</text><text class="n" x="580" y="230" style="fill:#2d3142">Memory, cron, workflows</text><text class="s" x="552" y="252" style="fill:#2d3142">SHIPPED 0.6 to 0.8</text><text class="s" x="552" y="270">human reads every change</text><rect x="784" y="150" width="232" height="250" rx="6" fill="#f0dcd6" stroke="#bf4520" stroke-width="1.5" stroke-dasharray="6,4"/><text x="800" y="182" style="font-size:24px;font-weight:600;fill:#2d3142">4</text><text class="n" x="828" y="180" style="fill:#2d3142">Agent pipeline</text><text class="s" x="800" y="202" style="fill:#bf4520">BUILT 0.9.0, OFF</text><text class="s" x="800" y="220">human sets goals, rules</text><rect x="1032" y="100" width="232" height="300" rx="6" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="3,4"/><text x="1048" y="132" style="font-size:24px;font-weight:600;fill:#5a6580">5</text><text class="n" x="1076" y="130" style="fill:#5a6580">Coordinating agent</text><text class="s" x="1048" y="152" style="fill:#5a6580">LATER</text><text class="s" x="1048" y="170">separate layer, after stage 4</text><text class="s" x="1048" y="188">runs live; not in this kit</text><path d="M652,194 l-7,-12 l14,0 z" fill="#bf4520"/><text class="n" x="652" y="174" text-anchor="middle" style="fill:#bf4520">specter today (0.10.0)</text><text class="s" x="552" y="290">0.6 a solid 3: memory, chores</text><text class="s" x="552" y="306">0.7 routed: tiers, readiness</text><text class="s" x="552" y="322">0.8 measured: evidence</text><text class="s" x="800" y="240">human check by tier (none off),</text><text class="s" x="800" y="256">fix-round cap, merge queue</text><text class="s" x="800" y="272">0.10 hardened: size cap, fresh base</text><text class="s" x="800" y="288">no orchestrator in the kit</text><text class="e" x="40" y="436">RELEASES</text><rect x="40" y="450" width="232" height="132" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/><text class="n" x="56" y="478" style="font-size:18px">0.6.0</text><text class="s" x="56" y="498" style="fill:#5a6580">SHIPPED</text><text class="t" x="56" y="526" style="font-weight:600">memory, chores, In flight</text><text class="s" x="56" y="546">knowledge table, lessons,</text><text class="s" x="56" y="562">scheduled gates, report card</text><rect x="288" y="450" width="232" height="132" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/><text class="n" x="304" y="478" style="font-size:18px">0.7.0</text><text class="s" x="304" y="498" style="fill:#5a6580">SHIPPED</text><text class="t" x="304" y="526" style="font-weight:600">risk tiers, readiness</text><text class="s" x="304" y="546">tiers.py label, ready.py,</text><text class="s" x="304" y="562">review contract, verification</text><rect x="536" y="450" width="232" height="132" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/><text class="n" x="552" y="478" style="font-size:18px">0.8.0</text><text class="s" x="552" y="498" style="fill:#5a6580">SHIPPED</text><text class="t" x="552" y="526" style="font-weight:600">guardrails, evidence</text><text class="s" x="552" y="546">declared guardrails,</text><text class="s" x="552" y="562">tiers.py --evidence</text><rect x="784" y="450" width="232" height="132" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/><text class="n" x="800" y="478" style="font-size:18px">0.9.0</text><text class="s" x="800" y="498" style="fill:#5a6580">SHIPPED</text><text class="t" x="800" y="526" style="font-weight:600">human check by tier</text><text class="s" x="800" y="546">none built but off, fix-round</text><text class="s" x="800" y="562">cap, demotion, pipeline.md</text><rect x="1032" y="450" width="232" height="132" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/><text class="n" x="1048" y="478" style="font-size:18px">0.10.0</text><text class="s" x="1048" y="498" style="fill:#5a6580">SHIPPED</text><text class="t" x="1048" y="526" style="font-weight:600">v061 trust hardening</text><text class="s" x="1048" y="546">size cap, base must be current,</text><text class="s" x="1048" y="562">parallel playbook, kit tools</text><rect x="1280" y="450" width="232" height="132" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1" stroke-dasharray="3,4"/><text class="n" x="1296" y="478" style="font-size:18px">NEXT</text><text class="s" x="1296" y="498" style="fill:#5a6580">UNDECIDED</text><text class="t" x="1296" y="526" style="font-weight:600">0.11 follow-ups (#40)</text><text class="s" x="1296" y="546">live test of the recipe,</text><text class="s" x="1296" y="562">then a stage 5 proposal</text><text class="s" x="40" y="618">0.10.0 is shipped. Stage 5 comes later, after stage 4 runs live and is not built; the kit has no scheduler, queue or merge bot.</text><line x1="40" x2="1512" y1="658" y2="658" stroke="#bfc0c0"/><line x1="40" x2="68" y1="676" y2="676" stroke="#4f5d75" stroke-width="1.5"/><text class="s" x="78" y="680">shipped</text><line x1="152.8" x2="180.8" y1="676" y2="676" stroke="#4f5d75" stroke-width="1.5" stroke-dasharray="5,4"/><text class="s" x="190.8" y="680">planned or candidate</text></svg>
