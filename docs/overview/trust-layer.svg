 height="18" fill="#f5f5f5"/><text class="l" x="1168" y="446.5" text-anchor="middle">MERGE + TRAILER</text><rect x="64" y="80" width="240" height="76" fill="#f5f5f5"/><rect x="64" y="80" width="240" height="76" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/><text class="n" x="80" y="106">Tiers table</text><text class="s" x="80" y="126">autonomy.md, read at base</text><text class="s" x="80" y="142">tier, paths, reviewer, human</text><rect x="64" y="200" width="240" height="76" fill="#f5f5f5"/><rect x="64" y="200" width="240" height="76" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/><text class="n" x="80" y="226">Guardrails table</text><text class="s" x="80" y="246">platform rules, dated</text><text class="s" x="80" y="262">undeclared: none -&gt; spot</text><rect x="360" y="140" width="240" height="76" fill="#f5f5f5"/><rect x="360" y="140" width="240" height="76" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/><text class="n" x="376" y="166">tiers.py label</text><text class="s" x="376" y="186">### Risk tier block</text><text class="s" x="376" y="202">strictest file wins</text><rect x="360" y="270" width="240" height="76" fill="#f5f5f5"/><rect x="360" y="270" width="240" height="76" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/><text class="n" x="376" y="296">gates.py</text><text class="s" x="376" y="316">### Gates block</text><text class="s" x="376" y="332">every row ran and passed</text><rect x="360" y="370" width="240" height="76" fill="#f5f5f5"/><rect x="360" y="370" width="240" height="76" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/><text class="n" x="376" y="396">Review contract</text><text class="s" x="376" y="416">### Review block</text><text class="s" x="376" y="432">a blocker needs all 4 cells</text><rect x="360" y="470" width="240" height="76" fill="#f5f5f5"/><rect x="360" y="470" width="240" height="76" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/><text class="n" x="376" y="496">Verification</text><text class="s" x="376" y="516">### Verification block</text><text class="s" x="376" y="532">REQ -&gt; artifact that exists</text><rect x="660" y="310" width="240" height="96" fill="#f5f5f5"/><rect x="660" y="310" width="240" height="96" rx="6" fill="#f0dcd6" stroke="#bf4520" stroke-width="1.5"/><text class="n" x="676" y="336">ready.py verdict</text><text class="s" x="676" y="356">### Readiness block</text><text class="s" x="676" y="372">runs no command</text><text class="s" x="676" y="388">exit 1 means not ready</text><rect x="980" y="320" width="240" height="76" fill="#f5f5f5"/><rect x="980" y="320" width="240" height="76" rx="6" fill="#ececec" stroke="#2d3142" stroke-width="1"/><text class="n" x="996" y="346">Human check</text><text class="s" x="996" y="366">still every change (0.8.0)</text><text class="s" x="996" y="382">adds Human-Findings: n</text><rect x="980" y="490" width="240" height="96" fill="#f5f5f5"/><rect x="980" y="490" width="240" height="96" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/><text class="n" x="996" y="516">tiers.py --evidence</text><text class="s" x="996" y="536">merged, reverted, escaped,</text><text class="s" x="996" y="552">human-caught per tier window</text><text class="s" x="996" y="568">edits nothing</text><text class="e" x="64" y="66">RULES AT THE BASE COMMIT</text><text class="e" x="360" y="256">DECLARED BY THE PR, CHECKED AGAINST THE BASE</text><text class="e" x="980" y="430">AFTER THE MERGE</text><line x1="40" x2="1260" y1="632" y2="632" stroke="#bfc0c0"/><line x1="40" x2="68" y1="650" y2="650" stroke="#4f5d75" stroke-width="1.5"/><text class="s" x="78" y="654">judged before merge</text><line x1="229.60000000000002" x2="257.6" y1="650" y2="650" stroke="#4f5d75" stroke-width="1.5" stroke-dasharray="5,4"/><text class="s" x="267.6" y="654">feedback from history</text><rect x="432.0" y="643" width="28" height="14" rx="3" fill="#f0dcd6" stroke="#bf4520" stroke-width="1.5"/><text class="s" x="470.0" y="654">the verdict</text><rect x="570.4" y="643" width="28" height="14" rx="3" fill="#ececec" stroke="#2d3142"/><text class="s" x="608.4" y="654">human</text></svg>
