<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 500" width="1280" height="500" role="img" aria-labelledby="workflow-title workflow-desc">
<title id="workflow-title">Specter spec-first workflow</title>
<desc id="workflow-desc">One-time setup (GO, install, setup interview) then the per-change loop: spec, implement, gates, review, human check, sync.</desc>
<defs>
<marker id="workflow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#4f5d75"/></marker>
<marker id="workflow-ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#bf4520"/></marker>
</defs>
<rect width="1280" height="500" fill="#f5f5f5"/>
<style>text{font-family:Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif}.n{font-size:14px;font-weight:600;fill:#2d3142}.s{font-family:'Geist Mono', ui-monospace, Menlo, monospace;font-size:10.5px;fill:#5a6580}.l{font-family:'Geist Mono', ui-monospace, Menlo, monospace;font-size:10px;letter-spacing:.06em;fill:#4f5d75}.e{font-family:'Geist Mono', ui-monospace, Menlo, monospace;font-size:10.5px;letter-spacing:.12em;fill:#5a6580}.t{font-size:12px;fill:#2d3142}</style>
<text class="e" x="40" y="44">ONCE PER PROJECT</text><text class="e" x="40" y="244">EVERY CHANGE</text><path d="M200,106 L248,106" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#workflow-a)"/><path d="M408,106 L456,106" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#workflow-a)"/><path d="M536,142 L536.0,208.0 Q536,216 528.0,216.0 L128.0,216.0 Q120,216 120.0,224.0 L120,270" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#workflow-ac)"/><path d="M200,306 L248,306" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#workflow-a)"/><path d="M408,306 L456,306" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#workflow-a)"/><path d="M616,306 L664,306" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#workflow-a)"/><path d="M824,306 L872,306" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#workflow-a)"/><path d="M1032,306 L1080,306" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#workflow-a)"/><path d="M516,342 L516.0,364.0 Q516,372 508.0,372.0 L376.0,372.0 Q368,372 368.0,364.0 L368,342" fill="none" stroke="#4f5d75" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#workflow-a)"/><path d="M724,342 L724.0,390.0 Q724,398 716.0,398.0 L344.0,398.0 Q336,398 336.0,390.0 L336,342" fill="none" stroke="#4f5d75" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#workflow-a)"/><rect x="423.0" y="363" width="78.0" height="18" fill="#f5f5f5"/><text class="l" x="462" y="375.5" text-anchor="middle">RED: RETRY</text><rect x="621.4" y="389" width="65.2" height="18" fill="#f5f5f5"/><text class="l" x="654" y="401.5" text-anchor="middle">BLOCKERS</text><rect x="191.0" y="207" width="78.0" height="18" fill="#f5f5f5"/><text class="l" x="230" y="219.5" text-anchor="middle">SETUP DONE</text><rect x="40" y="70" width="160" height="72" fill="#f5f5f5"/><rect x="40" y="70" width="160" height="72" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/><text class="n" x="56" y="96">GO.md</text><text class="s" x="56" y="116">paste one line</text><text class="s" x="56" y="132">agent looks first</text><rect x="248" y="70" width="160" height="72" fill="#f5f5f5"/><rect x="248" y="70" width="160" height="72" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/><text class="n" x="264" y="96">install.sh</text><text class="s" x="264" y="116">kit into .specs/kit/</text><text class="s" x="264" y="132">asks before it writes</text><rect x="456" y="70" width="160" height="72" fill="#f5f5f5"/><rect x="456" y="70" width="160" height="72" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/><text class="n" x="472" y="96">Setup interview</text><text class="s" x="472" y="116">as-built docs, Drift</text><text class="s" x="472" y="132">Register, profile</text><rect x="40" y="270" width="160" height="72" fill="#f5f5f5"/><rect x="40" y="270" width="160" height="72" rx="6" fill="#f0dcd6" stroke="#bf4520" stroke-width="1.5"/><text class="n" x="56" y="296">Spec</text><text class="s" x="56" y="316">REQ, design, tasks</text><text class="s" x="56" y="332">lint, you approve</text><rect x="248" y="270" width="160" height="72" fill="#f5f5f5"/><rect x="248" y="270" width="160" height="72" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/><text class="n" x="264" y="296">Implement</text><text class="s" x="264" y="316">one task, one worker</text><text class="s" x="264" y="332">never commits</text><rect x="456" y="270" width="160" height="72" fill="#f5f5f5"/><rect x="456" y="270" width="160" height="72" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/><text class="n" x="472" y="296">Gates</text><text class="s" x="472" y="316">the project&#x27;s table</text><text class="s" x="472" y="332">scripts, exit 0</text><rect x="664" y="270" width="160" height="72" fill="#f5f5f5"/><rect x="664" y="270" width="160" height="72" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/><text class="n" x="680" y="296">Review</text><text class="s" x="680" y="316">fresh context</text><text class="s" x="680" y="332">frozen diff only</text><rect x="872" y="270" width="160" height="72" fill="#f5f5f5"/><rect x="872" y="270" width="160" height="72" rx="6" fill="#ececec" stroke="#2d3142" stroke-width="1"/><text class="n" x="888" y="296">Human check</text><text class="s" x="888" y="316">rerun gate, read the</text><text class="s" x="888" y="332">verdict, then commit</text><rect x="1080" y="270" width="160" height="72" fill="#f5f5f5"/><rect x="1080" y="270" width="160" height="72" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/><text class="n" x="1096" y="296">Sync, close out</text><text class="s" x="1096" y="316">fold into domains/</text><text class="s" x="1096" y="332">trace REQs, log drift</text><line x1="40" x2="1240" y1="452" y2="452" stroke="#bfc0c0"/><line x1="40" x2="68" y1="470" y2="470" stroke="#4f5d75" stroke-width="1.5"/><text class="s" x="78" y="474">handoff</text><line x1="152.8" x2="180.8" y1="470" y2="470" stroke="#4f5d75" stroke-width="1.5" stroke-dasharray="5,4"/><text class="s" x="190.8" y="474">retry loop</text><rect x="284.8" y="463" width="28" height="14" rx="3" fill="#f0dcd6" stroke="#bf4520" stroke-width="1.5"/><text class="s" x="322.8" y="474">entry to the loop</text><rect x="461.6" y="463" width="28" height="14" rx="3" fill="#ececec" stroke="#2d3142"/><text class="s" x="499.6" y="474">human</text><text class="s" x="1240" y="474" text-anchor="end">a one-file change with no contract skips Spec</text></svg>
