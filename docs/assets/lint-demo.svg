<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
  <style>
    .bg { fill: #0d1117; }
    .bar { fill: #161b22; }
    .frame { fill: none; stroke: #30363d; stroke-width: 1.5; }
    .t { fill: #e6edf3; }
    .dim { fill: #8b949e; }
    .p { fill: #3fb950; }
    .fail { fill: #f85149; font-weight: 600; }
    .ok { fill: #3fb950; }
    .cite { fill: #d2a8ff; }
    .note { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; }
  </style>
  <rect class="bg" x="0" y="0" width="960" height="330" rx="10"/>
  <path class="bar" d="M10 0 H950 A10 10 0 0 1 960 10 V32 H0 V10 A10 10 0 0 1 10 0 Z"/>
  <rect class="frame" x="0.75" y="0.75" width="958.5" height="328.5" rx="10"/>
  <circle cx="20" cy="16" r="6" fill="#f85149"/><circle cx="40" cy="16" r="6" fill="#d29922"/><circle cx="60" cy="16" r="6" fill="#3fb950"/>
  <text class="note" x="480" y="20" text-anchor="middle">the agent wrote the spec · the lint checks every citation against the code</text>

  <text x="24" y="62"><tspan class="p">$</tspan><tspan class="t"> cat .specs/domains/orders/requirements.md</tspan></text>
  <text class="t" x="24" y="84"># Orders — Requirements</text>
  <text x="24" y="106"><tspan class="t">- Requests older than the clock-skew window are rejected (</tspan><tspan class="cite">`src/orders/OrderService.java:20`</tspan><tspan class="t">).</tspan></text>
  <text x="24" y="126"><tspan class="t">- Retries reuse the idempotency key (</tspan><tspan class="cite">`src/orders/OrderService.java:142`</tspan><tspan class="t">).</tspan></text>
  <text x="24" y="146"><tspan class="t">- Rate limits come from </tspan><tspan class="cite">`src/orders/RateLimiter.java:12`</tspan><tspan class="t">.</tspan></text>

  <text x="24" y="184"><tspan class="p">$</tspan><tspan class="t"> python3 .specs/kit/scripts/spec_lint.py --cites</tspan></text>
  <text x="24" y="206"><tspan class="fail">FAIL</tspan><tspan class="t"> cite domains/orders/requirements.md: `src/orders/OrderService.java:142` past end of file (39 lines)</tspan></text>
  <text x="24" y="226"><tspan class="fail">FAIL</tspan><tspan class="t"> cite domains/orders/requirements.md: `src/orders/RateLimiter.java:12` no such file</tspan></text>
  <text class="t" x="24" y="246">spec-lint --cites: 2 FAIL of 3 citation(s)</text>
  <text x="24" y="276"><tspan class="p">$</tspan><tspan class="t"> echo $?</tspan></text>
  <text class="fail" x="24" y="298">1</text>
  <text class="note" x="936" y="298" text-anchor="end">plain Python, no AI: same answer every run, in CI or a pre-commit hook</text>
</svg>
